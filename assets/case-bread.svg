    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1675ef"/><stop offset="1" stop-color="#0054be"/></linearGradient>
    <linearGradient id="breadFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9dbbd"/><stop offset="1" stop-color="#ccac76"/></linearGradient>
    <linearGradient id="basketFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f2f4f7"/><stop offset="1" stop-color="#dce3ec"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dy="10" stdDeviation="14" flood-color="#58728e" flood-opacity=".075"/></filter>

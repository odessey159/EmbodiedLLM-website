<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">U08: instruction changes during a recorded bread-basket task</title>
  <desc id="desc">Recorded events from Harness 1.2.3.5: the compared runs share the first 320 actions; a new instruction at step 321 asks for bread in the basket, another at step 513 asks to move the basket, and the task succeeds at step 1127. All physical actions in this attempt came from the VLA. Event spacing is not proportional to elapsed time.</desc>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m2 1 5 4-5 4" stroke="#0871e7" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker>

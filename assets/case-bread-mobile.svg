<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1010" viewBox="0 0 480 1010" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">U08: recorded bread-basket events</title>
  <desc id="desc">Recorded events from Harness 1.2.3.5: the compared runs share the first 320 actions; new instructions are sent at steps 321 and 513; task success occurs at step 1127. All physical actions came from the VLA. Event spacing is not proportional to elapsed time.</desc>
  <defs>
    <linearGradient id="bg" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4f7fb"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1675ef"/><stop offset="1" stop-color="#0054be"/></linearGradient>
    <linearGradient id="breadFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9dbbd"/><stop offset="1" stop-color="#ccac76"/></linearGradient>
    <linearGradient id="basketFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f2f4f7"/><stop offset="1" stop-color="#dce3ec"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dy="10" stdDeviation="14" flood-color="#58728e" flood-opacity=".075"/></filter>
    <g id="bread"><path d="M-52 6c-6-23 13-40 35-35 13-19 40-14 47 4 23-1 35 20 22 38-9 14-25 19-51 19-26 0-47-8-53-26Z" fill="url(#breadFill)" stroke="#b69c74" stroke-width="2.5"/><path d="m-25-8 11 10m10-17 12 11m9-10 10 11" stroke="#b69865" stroke-width="4" stroke-linecap="round"/></g>
    <g id="basket"><path d="m-72 0 13 73c2 11 10 17 21 17h77c11 0 19-6 21-17L73 0" fill="url(#basketFill)" stroke="#9baabd" stroke-width="3"/><path d="M-44 1v-18c0-29 18-50 44-50s44 21 44 50V1" stroke="#a8b5c6" stroke-width="8"/><path d="M-72 0H73" stroke="#8598b1" stroke-width="8" stroke-linecap="round"/><path d="m-44 23 5 43m20-43 2 43m20-43v43m21-43-3 43m21-43-5 43" stroke="#bac6d6" stroke-width="3" stroke-linecap="round"/></g>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m2 1 5 4-5 4" stroke="#0871e7" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <path fill="url(#bg)" d="M0 0h480v1010H0z"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="24" y="45" fill="#64758b" font-size="20" font-weight="600">U08 / BREAD BASKET</text>
    <text x="24" y="99" fill="#182638" font-size="38" font-weight="600">One task.</text>
    <text x="24" y="144" fill="#182638" font-size="38" font-weight="600">Two instructions.</text>
    <text x="24" y="185" fill="#718094" font-size="22">Harness 1.2.3.5 · All actions from VLA</text>
    <rect x="24" y="220" width="432" height="154" rx="24" fill="#fff" stroke="#e4eaf1"/>
    <rect x="24" y="392" width="432" height="180" rx="24" fill="#fff" stroke="#d7e8fb"/>
    <rect x="24" y="590" width="432" height="180" rx="24" fill="#fff" stroke="#d7e8fb"/>
    <rect x="24" y="788" width="432" height="154" rx="24" fill="#fff" stroke="#d7e8fb"/>
    <path d="M240 374v18" stroke="#c2d5ec" stroke-width="2" stroke-linecap="round"/>
    <path d="M240 572v18" stroke="#c2d5ec" stroke-width="2" stroke-linecap="round"/>
    <path d="M240 770v18" stroke="#c2d5ec" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="254" fill="#8190a2" font-size="20" font-weight="600">SHARED PREFIX</text>
    <text x="48" y="299" fill="#25364a" font-size="30" font-weight="600">Step 320</text>
    <text x="48" y="339" fill="#718094" font-size="22">Same first 320 actions</text>
<path d="M362 285h48m-48 12h48" stroke="#b6c5d6" stroke-width="4" stroke-linecap="round"/>
    <text x="48" y="426" fill="#1673df" font-size="20" font-weight="600">NEW INSTRUCTION</text>
    <text x="48" y="469" fill="#25364a" font-size="30" font-weight="600">Step 321</text>
    <text x="48" y="511" fill="#276bab" font-size="22">“Place the bread in the basket</text>
    <text x="48" y="541" fill="#276bab" font-size="22">on the counter.”</text>
<use href="#basket" transform="translate(393 461) scale(.29)"/>
<use href="#bread" transform="translate(393 445) scale(.27)"/>
    <text x="48" y="624" fill="#1673df" font-size="20" font-weight="600">NEW INSTRUCTION</text>
    <text x="48" y="667" fill="#25364a" font-size="30" font-weight="600">Step 513</text>
    <text x="48" y="709" fill="#276bab" font-size="22">“Then move the basket to</text>
    <text x="48" y="739" fill="#276bab" font-size="22">the dining counter.”</text>
<use href="#basket" transform="translate(386 659) scale(.29)"/>
<use href="#bread" transform="translate(386 643) scale(.27)"/>
<path d="M412 651h17m-5-5 6 5-6 5" stroke="#1673df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="822" fill="#1673df" font-size="20" font-weight="600">OFFICIAL OUTCOME</text>
    <text x="48" y="865" fill="#25364a" font-size="30" font-weight="600">Step 1,127</text>
    <text x="48" y="906" fill="#276bab" font-size="22">Success · Task complete</text>
    <circle cx="393" cy="865" r="31" fill="#edf5ff"/>
    <circle cx="393" cy="865" r="23" fill="url(#blue)"/>
    <path d="m383 865 7 7 14-15" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="981" fill="#8190a2" font-size="20">Event sequence · control steps</text>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1010" viewBox="0 0 480 1010" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">C10: recorded pan pre-soaking events</title>
  <desc id="desc">Recorded events from Harness 1.2.3.5: the compared runs share the first 1600 actions; at step 1601 the effective instruction changes to Then turn on the water; the task succeeds at step 2277. All physical actions came from the VLA. Event spacing is not proportional to elapsed time.</desc>
